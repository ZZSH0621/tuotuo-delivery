<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171419">
<title>TUOTUO 妥妥 · 语音记录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ff2ba5'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='%23171419'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mobile.css"><script type="module" src="app.js"></script>
</head>
<body>
<div class="app-shell">
<header class="app-header"><button id="back" class="icon-button" aria-label="返回语音首页" hidden></button><a class="brand" href="#voice" aria-label="TUOTUO 妥妥首页"><span class="wordmark">TUOTUO</span><b>妥妥</b></a></header>
<main id="main">
<section id="voice-view" class="view" aria-label="语音记录">

<div class="brand-banner" aria-label="妥妥，照护工作搭子"><div><strong class="wordmark">TUOTUO</strong><b>妥妥 · 照护工作搭子</b></div><span class="mascot" role="img" aria-label="戴着蓝色小帽的毛绒妥妥"></span><span class="sticker">妥妥在听</span></div>
<button id="api-mode" hidden>语音记录</button>
<div class="model-row" id="model-row" role="status"><span id="model-summary">Qwen · 个人 API</span><span class="model-state"><span id="config-state">未配置</span></span></div>
<div class="recorder" id="recorder" role="region" aria-label="语音记录">
<div class="waveform" id="waveform" aria-hidden="true"></div>
<div class="timer" id="timer" aria-label="录音时长">00:00</div><p class="recorder-caption" id="record-caption" role="status" aria-live="polite">说完自动转写</p>
<div id="record-actions" class="record-actions"><button class="mic-button" id="record" aria-label="按住说话，松开后自动记录"><i data-icon="mic"></i></button><b id="record-label">按住说话</b></div>
<div id="active-actions" class="active-actions" hidden><button id="pause" class="secondary"><i data-icon="pause"></i><span>暂停</span></button><button id="stop" class="primary"><i data-icon="stop"></i>结束并转写</button></div>
<button id="cancel-recording" class="secondary wide" hidden>取消录音，不发送</button>
<div class="audio-ready" id="audio-ready" hidden><div class="file-info"><i data-icon="audio"></i><span id="file-name">本轮录音</span><button id="remove-audio" class="icon-button" aria-label="移除音频"><i data-icon="close"></i></button></div><audio id="audio-preview" controls hidden></audio><p id="audio-hint">录音结束后自动转写，可试听原始音频。</p><p id="send-target" class="scope-note" hidden></p><input id="send-consent" type="checkbox" hidden><button id="transcribe" class="primary wide">重试转写<i data-icon="arrow"></i></button></div>

<input type="file" id="audio-file" accept="audio/*,.wav,.mp3,.m4a,.ogg,.webm" hidden>

</div>
<p class="error" id="record-error" role="alert" hidden></p><p class="session-state" id="session-state" role="status">正在读取 API 可用状态…</p>
</section>
</main>
<nav class="bottom-nav" aria-label="主要导航"><button data-view="voice" aria-current="page"><i data-icon="mic"></i><span>语音</span></button></nav>
</div>
<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
